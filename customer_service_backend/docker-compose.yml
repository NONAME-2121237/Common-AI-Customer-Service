version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: customer-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - customer_service_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-service-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_SIMPLE_MEMORY=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - users_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - customer_service_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: customer-service-webui
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - customer_service_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  users_data:
    driver: local

networks:
  customer_service_net:
    driver: bridge
