app:
  name: "智能客服后端"
  debug: false
  max_agent_iterations: 5

providers:
  - id: deepseek_main
    type: openai_compatible
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_KEY}"
    timeout: 30
    models:
      - name: deepseek-chat
        default_params:
          temperature: 0.7
          max_tokens: 2048
      - name: deepseek-reasoner
        default_params:
          temperature: 0.3
          max_tokens: 4096
  - id: siliconflow
    type: openai_compatible
    base_url: "https://api.siliconflow.cn/v1"
    api_key: "${SILICONFLOW_KEY}"
    models:
      - name: deepseek-ai/DeepSeek-V2.5
      - name: Qwen/Qwen2-7B-Instruct
  - id: local_llamaguard
    type: openai_compatible
    base_url: "http://localhost:8080/v1"
    api_key: "dummy"
    models:
      - name: Meta-Llama-Guard-2-8B

models:
  flash: "deepseek_main/deepseek-chat"
  pro: "deepseek_main/deepseek-reasoner"
  cheap: "siliconflow/Qwen/Qwen2-7B-Instruct"
  safety: "local_llamaguard/Meta-Llama-Guard-2-8B"

tasks:
  pre_guard:
    model: "safety"
    fallback: "rule_based"
    timeout: 2
  intent_classify:
    model: "cheap"
  short_term_plan:
    model: "flash"
  main_response:
    model: "pro"
  simple_response:
    model: "flash"
  post_guard:
    model: "safety"

memory:
  short_term:
    provider: "redis_score"
    config:
      url: "redis://localhost:6379/0"
      ttl: 7200
      storage_limit: 30
      recall_limit: 6
      max_age_seconds: 1800
      scoring:
        importance_weights:
          has_order_number: 5
          has_product_name: 3
          requested_remember: 10
          is_resolved_marker: -5

knowledge:
  provider: "dify"
  config:
    api_base: "http://localhost:5001/v1"
    api_key: "${DIFY_API_KEY}"
    retrieval_top_k: 3

routing:
  transfer:
    enabled: true
    default_target_url: "https://human-support.example.com/webhook"
    method: "POST"
    headers:
      Content-Type: "application/json"
    timeout: 5
    retry: 1
    auto_release_seconds: 600
    clear_memory_on_transfer: true
    freeze_memory_during_transfer: true

security:
  pre_guard:
    enabled: true
    rule_based_fallback: true
  post_guard:
    enabled: true

agent:
  system_prompt_template: |
    你是客服助手。使用知识库优先。禁止角色扮演。回复简洁礼貌。
    对话历史：{history}
    知识库：{context}
    用户：{user_input}
  response_templates:
    escalate: "已为您转接人工客服。"
    rejection: "请遵守对话规范。"
    interrupt_limit: "您输入太快，请稍后重试。"
  max_interrupt_count: 5
  escalate_keywords:
    - "人工客服"
    - "转人工"
  think_prompt: |
    根据对话输出JSON决策：{{"decision": "direct/rag/escalate", "reason": "..."}}
    对话：{history}
    输入：{user_input}

admin:
  api_key: ""
  log_file: "logs/app.log"

logging:
  file: "logs/app.log"
  level: "INFO"
